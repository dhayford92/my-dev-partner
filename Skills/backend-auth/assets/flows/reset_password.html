<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your password</title></head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:24px;">
  <div style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:8px; padding:32px;">
    <h1 style="color:#111; font-size:22px;">Reset your password</h1>
    <p style="color:#444; font-size:15px; line-height:1.6;">
      Hi {{ full_name }}, we received a request to reset your password. This link expires
      shortly. If you didn't request it, you can ignore this email.
    </p>
    <p style="text-align:center; margin:28px 0;">
      <a href="{{ reset_url }}"
         style="background:#111; color:#fff; text-decoration:none; padding:12px 24px; border-radius:6px; font-size:15px;">
        Reset password
      </a>
    </p>
    <p style="color:#888; font-size:13px;">
      If the button doesn't work, paste this link into your browser:<br>{{ reset_url }}
    </p>
  </div>
</body>
</html>
